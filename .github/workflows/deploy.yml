name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ondrapelikan
      - uses: actions/checkout@v4
        with:
          repository: koci-sabachova/13remesel
          path: 13remesel
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
        working-directory: ondrapelikan
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ondrapelikan/docs
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-forpsi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ondrapelikan
      - uses: actions/checkout@v4
        with:
          repository: koci-sabachova/13remesel
          path: 13remesel
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
        working-directory: ondrapelikan
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpx.forpsi.com
          username: www.ondrapelikan.cz
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./ondrapelikan/docs/
          server-dir: /www/
          timeout: 300000
