<style>
  .not-found {
    min-height: 70vh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: var(--space-10) var(--space-5);
  }
  .not-found h1 { font-size: clamp(1.5rem, 1rem + 1.5vw, 2rem); margin-bottom: var(--space-4); }
  .not-found p { margin: 0 auto var(--space-3); max-width: 38rem; color: var(--color-muted); }
  .not-found a {
    margin-top: var(--space-6);
    display: inline-block;
    padding: var(--space-3) var(--space-5);
    border: 1px solid var(--color-ink);
    color: var(--color-ink);
    text-decoration: none;
    font-weight: 700;
  }
  .not-found a:hover { background: var(--color-ink); color: var(--color-bg); }
</style>

<body>
<main id="main">
  <section class="not-found">
    <div>
