title: Matko dej mi chlast

poemTitle: Lež tady
poemText: |-
  Lež ve víně.
  Matko dej mi chlast.
  Dej mi chlast
  abych mohla.
  Abych mohla matko
  konečně to pustit ven.

  Matko dej mi chlast.
  Pustit trauma ze všech co mě posrali
  a posrat ostatní.
  Matko dej mi kuráž,
  matko dej mi vůli.
  Chlaste buď mi otcem
  a řekni mi co říct.
  Chlaste buď mi milujícím bratrem,
  dej mi respekt, úctu.

  Chlaste sereš mě.
  Matko dej mi chlast.
  Chlast mi rozumí.
  Chlast mi naslouchá.
  Chlast je mi bratrem.
  Chlast je mi kruhem.
  Chlast je můj kostel.
  Nechci žít s chlastem.
  Oni se mě neujali.
  Chlast mi věří,
  že mu věřím,
  můžu se mu svěřit.

  Oni mě tu nechali.
  Chlast se o mě stará.
  Bezpodmínečně mně miluje.
  Chlast ví, že přijdu.
  Nesnáším chlast.
  Matko dej mi chlast.
  Nemám se na koho jinýho obrátit.

  Matko dej mi otce a bratra.
  Vyměním je za chlast.
  Otče vyměň chlast za život.
  Vyměň chlast za nás, tvoje děti.
  Budeme se mít rádi.
  Matko dej mi chlast.

  Chlaste!
  Ty chlaste táhni!
  Táhni za jinejma sakra chlastama!
  Nech nás tady,
  nemáme tě rádi.
  Matko dej mi chlast.

  Chlaste dej si brko.
  Chlaste dej si keťák a houby a papír.
  Chlaste jeď na Kanáry,
  kup si tam dům na sopce.
  Chlaste jdi na terapii.
  Chlaste jdi do sakra prdele.

  Já umím být skvělá,
  ty mě kurvíš chlaste.
  Chlaste s tebou já nejsem já.
  Matko dej mi chlast.
  Chlaste dej mi bratra.

  Trauma dej si chlast a houby a keťák a papír
  jeďte černou smrdutou ponorkou na Tenerife,
  půjčte si tam auto s pohonem zla,
  vyjeďte na nejvyšší sopku
  a hoďte tam kalhoty politý vyjeťákem.
  Podejte si ruce namazaný lepem na mravence.

  A jděte všichni na terapii.

  Otec, matka, bratr, trauma a chlast.

  A já vás tam pak vyzvednu.
